services:
  - type: web
    name: rgsg-ihs-g11-booking-test
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: python3 -m compileall server.py
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: IHS_TEST_ADMIN_PIN
        sync: false
      - key: IHS_DB_PATH
        value: /var/data/booking_test.db
    disk:
      name: booking-data
      mountPath: /var/data
      sizeGB: 1
